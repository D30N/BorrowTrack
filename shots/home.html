<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:360px;height:740px;background:#0e0d0b;color:#f3efe8;font-family:sans-serif;position:relative}
.bar{display:flex;align-items:center;justify-content:space-between;padding:38px 16px 10px}
.logo{font-weight:800;font-size:20px}.logo span{color:#f59e0b}
.fab{width:40px;height:40px;border-radius:50%;background:#f59e0b;color:#1c1005;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sum{display:flex;gap:10px;padding:0 14px 12px}
.stat{flex:1;background:#17140f;border:1px solid #2a241a;border-radius:14px;padding:11px 13px}
.stat .n{font-size:22px;font-weight:800;color:#f59e0b}.stat .l{font-size:11px;color:#a89f8d;margin-top:3px}
.seg{display:flex;background:#17140f;border:1px solid #2a241a;border-radius:12px;margin:0 14px 12px;padding:3px}
.seg div{flex:1;text-align:center;font-size:13px;font-weight:700;padding:9px;border-radius:9px;color:#a89f8d}
.seg div.on{background:#f59e0b;color:#1c1005}
.card{background:#17140f;border:1px solid #2a241a;border-radius:14px;padding:12px 14px;margin:0 14px 10px}
.r1{display:flex;align-items:center;justify-content:space-between}
.item{font-size:14px;font-weight:700}
.badge{font-size:10px;font-weight:700;padding:4px 10px;border-radius:12px}
.red{background:rgba(239,68,68,.15);color:#f87171}.amber{background:rgba(245,158,11,.15);color:#fbbf24}.green{background:rgba(34,197,94,.15);color:#4ade80}
.p{font-size:12px;color:#a89f8d;margin-top:5px}.d{font-size:11.5px;color:#a89f8d;margin-top:3px}.d b{color:#f3efe8}
.nav{position:absolute;bottom:0;left:0;right:0;display:flex;border-top:1px solid #2a241a;background:#100e0b;padding:9px 0 22px}
.tab{flex:1;text-align:center}.tab .i{font-size:18px}.tab .t{font-size:10px;margin-top:3px;color:#6e6656}.tab.on .t{color:#f59e0b;font-weight:700}
</style></head><body>
<div class="bar"><div class="logo">Borrow<span>Track</span></div><div class="fab">+</div></div>
<div class="sum"><div class="stat"><div class="n">3</div><div class="l">തിരികെ കിട്ടാനുള്ളത്</div></div><div class="stat"><div class="n">2</div><div class="l">തിരികെ കൊടുക്കാനുള്ളത്</div></div></div>
<div class="seg"><div class="on">കൊടുത്തത്</div><div>വാങ്ങിയത്</div></div>
<div class="card"><div class="r1"><div class="item">₹500</div><div class="badge red">OVERDUE</div></div><div class="p">Priya · 3 ദിവസം overdue</div><div class="d">Sep 28 ന് തിരികെ വേണ്ടതായിരുന്നു</div></div>
<div class="card"><div class="r1"><div class="item">Python book</div><div class="badge amber">DUE SOON</div></div><div class="p">Arun · കൊടുത്തത് Sep 20</div><div class="d">Return by <b>Oct 5</b></div></div>
<div class="card"><div class="r1"><div class="item">Charger</div><div class="badge green">OK</div></div><div class="p">Rahul · കൊടുത്തത് Sep 25</div><div class="d">Return by <b>Oct 10</b></div></div>
<div class="nav"><div class="tab on"><div class="i">🏠</div><div class="t">Home</div></div><div class="tab"><div class="i">🔔</div><div class="t">Reminders</div></div><div class="tab"><div class="i">📜</div><div class="t">History</div></div></div>
</body></html>

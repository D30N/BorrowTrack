<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:360px;height:740px;background:#0e0d0b;color:#f3efe8;font-family:sans-serif;position:relative}
.bar{display:flex;align-items:center;padding:38px 16px 10px}
.back{font-size:28px;margin-right:14px;color:#f3efe8}
.title{font-size:17px;font-weight:800}
.b{padding:4px 18px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:5px 11px;border-radius:12px;background:rgba(239,68,68,.15);color:#f87171}
.big{font-size:21px;font-weight:800;margin:10px 0 3px}
.sub{font-size:13.5px;color:#a89f8d}
.fl{font-size:11px;color:#a89f8d;font-weight:700;margin:14px 0 7px}
.fd{background:#17140f;border:1px solid #2a241a;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#6e6656}
.btn{background:#f59e0b;color:#1c1005;text-align:center;font-weight:800;font-size:15px;padding:14px;border-radius:14px;margin:0 18px;position:absolute;left:0;right:0}
.btn.ghost{background:#17140f;color:#f3efe8;border:1px solid #2a241a;bottom:150px}
.btn.solid{bottom:76px}
.nav{position:absolute;bottom:0;left:0;right:0;display:flex;border-top:1px solid #2a241a;background:#100e0b;padding:9px 0 22px}
.tab{flex:1;text-align:center}.tab .i{font-size:18px}.tab .t{font-size:10px;margin-top:3px;color:#6e6656}.tab.on .t{color:#f59e0b;font-weight:700}
</style></head><body>
<div class="bar"><div class="back">‹</div><div class="title">Details</div></div>
<div class="b">
<div class="badge">OVERDUE · 3 days</div>
<div class="big">₹500</div>
<div class="sub">Priya-ക്ക് കൊടുത്തത്</div>
<div class="fl">തീയതി</div><div class="fd">25 Sep 2026</div>
<div class="fl">തിരികെ വേണ്ട തീയതി</div><div class="fd">28 Sep 2026</div>
</div>
<div class="btn ghost">Remind</div>
<div class="btn solid">തിരികെ കിട്ടി ✓</div>
<div class="nav"><div class="tab on"><div class="i">🏠</div><div class="t">Home</div></div><div class="tab"><div class="i">🔔</div><div class="t">Reminders</div></div><div class="tab"><div class="i">📜</div><div class="t">History</div></div></div>
</body></html>

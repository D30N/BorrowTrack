<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:360px;height:740px;background:#0e0d0b;color:#f3efe8;font-family:sans-serif;position:relative}
.bar{display:flex;align-items:center;padding:38px 16px 10px}
.back{font-size:28px;margin-right:14px;color:#f3efe8}
.title{font-size:17px;font-weight:800}
.f{padding:4px 18px}
.tog{display:flex;background:#17140f;border:1px solid #2a241a;border-radius:12px;padding:3px}
.tog div{flex:1;text-align:center;font-size:13px;font-weight:700;padding:10px;border-radius:9px;color:#a89f8d}
.tog div.on{background:#f59e0b;color:#1c1005}
.fl{font-size:11px;color:#a89f8d;font-weight:700;margin:14px 0 7px}
.fd{background:#17140f;border:1px solid #2a241a;border-radius:12px;padding:12px 14px;font-size:13.5px}
.fd.dim{color:#6e6656}
.btn{background:#f59e0b;color:#1c1005;text-align:center;font-weight:800;font-size:15px;padding:14px;border-radius:14px;margin:18px;position:absolute;bottom:76px;left:0;right:0}
.nav{position:absolute;bottom:0;left:0;right:0;display:flex;border-top:1px solid #2a241a;background:#100e0b;padding:9px 0 22px}
.tab{flex:1;text-align:center}.tab .i{font-size:18px}.tab .t{font-size:10px;margin-top:3px;color:#6e6656}.tab.on .t{color:#f59e0b;font-weight:700}
</style></head><body>
<div class="bar"><div class="back">‹</div><div class="title">പുതിയ entry</div></div>
<div class="f">
<div class="tog"><div class="on">ഞാൻ കൊടുത്തു</div><div>ഞാൻ വാങ്ങി</div></div>
<div class="fl">ആര്</div><div class="fd">Priya</div>
<div class="fl">എന്ത്</div><div class="fd">₹500</div>
<div class="fl">തീയതി</div><div class="fd dim">25 Sep 2026</div>
<div class="fl">തിരികെ തീയതി</div><div class="fd dim">5 Oct 2026</div>
<div class="fl">കുറിപ്പ് (optional)</div><div class="fd dim">എഴുതൂ…</div>
</div>
<div class="btn">Save</div>
<div class="nav"><div class="tab on"><div class="i">🏠</div><div class="t">Home</div></div><div class="tab"><div class="i">🔔</div><div class="t">Reminders</div></div><div class="tab"><div class="i">📜</div><div class="t">History</div></div></div>
</body></html>
